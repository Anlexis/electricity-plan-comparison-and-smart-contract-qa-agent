[project]
name = "ene-c2-014"
version = "0.1.0"
description = "ElectricityPlanQAAgent — AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is not resolvable from the default index; it is
# installed from the package registry by CI. Pinning it here would make `pip install -e .`
# fail for anyone without that index configured.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",]

[project.optional-dependencies]
dev = [
    "pytest==8.1.1",
    "pytest-cov==5.0.0",
    "pytest-asyncio==0.23.6",
    "ruff==0.4.4",
    "mypy==1.10.0",
    "types-PyYAML==6.0.12.20260815",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
# Framework-wheel compatibility exception: the published agenticstar-agentcore wheel
# ships no py.typed marker, so framework.* / shared.* imports resolve to Any — which
# makes every required framework subclass an [import-untyped] / "subclass of Any"
# error. All other strict settings stay on.
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = ["framework.*", "shared.*", "langgraph.*"]
ignore_missing_imports = true

# State extends the framework's AgentState TypedDict. Correct at runtime, but the
# untyped wheel makes AgentState resolve to Any, so mypy cannot see the TypedDict base
# and mis-flags every field. Silence only that diagnostic, only for the state module.
[[tool.mypy.overrides]]
module = ["src.schemas.state"]
disable_error_code = ["valid-type"]
